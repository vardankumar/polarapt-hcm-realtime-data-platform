[project]
name = "polarapt-backbone"
version = "2.0.0"
description = "Polarapt HCM real-time external data backbone: USAJOBS, BLS, FX -> S3 -> SQS -> processors -> DynamoDB"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polarapt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
